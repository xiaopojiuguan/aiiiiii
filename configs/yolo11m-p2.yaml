# YOLO11m-P2 Model Configuration
# 添加 stride=4 的 P2 检测头用于小目标检测
# 基于 YOLO11m 架构

# Parameters
nc: 9  # number of classes

# Scaling
depth_multiple: 0.67  # YOLO11m
width_multiple: 0.50  # YOLO11m

# anchors (optional, YOLO11 is anchor-free)

# Backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]] # 8
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

# Head (PAN + Detect)
head:
  # Upsample branch
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 11
  - [[-1, 6], 1, Concat, [1]] # 12 cat with P4
  - [-1, 2, C3k2, [512, False]] # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14
  - [[-1, 4], 1, Concat, [1]] # 15 cat with P3
  - [-1, 2, C3k2, [256, False]] # 16 (P3/8-small)

  # P2 extra layer
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 17
  - [[-1, 2], 1, Concat, [1]] # 18 cat with P2
  - [-1, 2, C3k2, [128, False]] # 19 (P2/4)

  # Downsample branch (from P2)
  - [-1, 1, Conv, [128, 3, 2]] # 20
  - [[-1, 16], 1, Concat, [1]] # 21
  - [-1, 2, C3k2, [256, False]] # 22 (P3/8-small)

  # Downsample branch (from P3)
  - [-1, 1, Conv, [256, 3, 2]] # 23
  - [[-1, 13], 1, Concat, [1]] # 24
  - [-1, 2, C3k2, [512, False]] # 25 (P4/16-medium)

  # Downsample branch (from P4)
  - [-1, 1, Conv, [512, 3, 2]] # 26
  - [[-1, 10], 1, Concat, [1]] # 27
  - [-1, 2, C3k2, [1024, True]] # 28 (P5/32-large)

  # Detect
  - [[19, 22, 25, 28], 1, Detect, [nc]] # P2, P3, P4, P5
