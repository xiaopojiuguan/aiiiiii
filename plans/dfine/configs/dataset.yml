# ============================================================
# DEIM-D-FINE-X 数据集配置 (COCO JSON)
# ============================================================
# 图像: 1280×1280 RGB 切片 (保留小缺陷细节, 比 COCO 640 大一倍)
# 类别: 9 类钢板缺陷

task: detection
evaluator: CocoEvaluator
num_classes: 9

# ============================================================
# 训练集 Dataloader
# ============================================================
train_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: {TRAIN_IMG_DIR}
    ann_file: {TRAIN_JSON}
    return_masks: False
    transforms:
      type: Compose
      ops:
        - {type: RandomFlip, flip_prob: 0.5}
        - {type: RandomPhotometricDistort}
        - {type: RandomZoomOut, fill: [123.675, 116.28, 103.53]}
        - {type: RandomIoUCrop}
        - {type: MultiScaleResize, sizes: [960, 1088, 1216, 1280]}
        - {type: Normalize, mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}
        - {type: ToTensor}
  shuffle: True
  num_workers: 4
  total_batch_size: {BATCH_SIZE}
  collate_fn: default

# ============================================================
# 验证集 Dataloader
# ============================================================
val_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: {VAL_IMG_DIR}
    ann_file: {VAL_JSON}
    return_masks: False
    transforms:
      type: Compose
      ops:
        - {type: Resize, size: [1280, 1280]}
        - {type: Normalize, mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}
        - {type: ToTensor}
  shuffle: False
  num_workers: 4
  total_batch_size: {VAL_BATCH_SIZE}
  collate_fn: default
